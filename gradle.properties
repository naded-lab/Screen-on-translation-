# إعدادات JVM لعملية البناء (Build) - ذاكرة كافية بدون إسراف
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# تفعيل AndroidX (إلزامي)
android.useAndroidX=true

# منع توليد مكتبات Kotlin غير ضرورية (Non-transitive R class) - يقلل حجم APK
android.nonTransitiveRClass=true

# تسريع البناء عبر التوازي وذاكرة التخزين المؤقت
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin code style
kotlin.code.style=official

# تعطيل جمع الإحصاءات لتسريع البناء وتقليل الحمل
